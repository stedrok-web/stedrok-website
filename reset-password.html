<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Stedrok</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Reset Your Password</h1>
      <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div id="success-alert" class="alert alert-warning" style="display:none; background: rgba(34,197,94,0.15); color: var(--accent-green); border-left: 4px solid var(--accent-green);">
        <strong>Check your email!</strong>
        <p style="margin-top:8px;">We've sent a password reset link. Click it to create a new password. The link expires in 1 hour.</p>
      </div>

      <div id="error-alert" class="error-message" style="display:none;"></div>

      <form id="reset-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Send Reset Link</button>
        <div class="form-footer">
          <a href="login.html">Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://stedrok.org/reset.html',
        });

        if (error) {
          document.getElementById('error-alert').style.display = 'block';
          document.getElementById('error-alert').textContent = error.message;
        } else {
          document.getElementById('success-alert').style.display = 'block';
          document.getElementById('reset-form').style.display = 'none';
        }
      } catch (err) {
        document.getElementById('error-alert').style.display = 'block';
        document.getElementById('error-alert').textContent = 'Something went wrong. Try again.';
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
